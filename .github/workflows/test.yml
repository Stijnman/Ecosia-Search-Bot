name: Userscript CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-userscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: node --check index.js
      - name: Validate userscript metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("index.js").read_text()
          assert source.startswith("// ==UserScript=="), "Missing userscript header"
          for field in ("@name", "@match", "@grant", "@license"):
              assert field in source.split("// ==/UserScript==")[0], f"Missing {field}"
          assert "// ==/UserScript==" in source, "Unclosed userscript header"
          print("Userscript metadata validated")
          PY
      - name: Check for merge markers and whitespace
        run: |
          git diff --check
          if grep -nE '^(<<<<<<< |=======|>>>>>>> )' index.js; then
            echo "Unresolved merge markers in userscript" >&2
            exit 1
          fi
